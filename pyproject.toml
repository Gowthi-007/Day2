[project]
name = "Day2"
version = "0.1.0"
description = "Telemetry and data utilities"
requires-python = ">=3.11"

[tool.black]
line-length = 88

[tool.isort]
profile = "black"

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-q"
testpaths = ["tests", "day5"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
